<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Tree canopy — three layered triangles (top to bottom) -->
  <!-- Top layer -->
  <polygon points="16,4 11.5,12 20.5,12" fill="url(#leafGrad)"/>
  <!-- Middle layer -->
  <polygon points="16,8.5 9.5,18.5 22.5,18.5" fill="url(#leafGrad)"/>
  <!-- Bottom layer -->
  <polygon points="16,13.5 7,25.5 25,25.5" fill="url(#leafGrad)"/>

  <!-- Trunk -->
  <rect x="14" y="25" width="4" height="4" rx="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
